<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="SampleHyperStore: ask AI business questions that span 12 tables. / 12 枚の表をまたいで、AI と業務の問いを解く。">
<style>body{margin:0}</style>
<title>SampleHyperStore の分析体験</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Single light theme (white background in every viewer theme). One page, two languages: every text comes from L.ja / L.en and the page re-renders on switch.
   Layout: hero → join diagrams (3 tables vs 12 tables) → business rules (Business Preferences) → then
   type A (one case: business dashboard → question → five drill-down steps → answer), type B (two cases: who asks → agent reads data source and Knowledge → two answers),
   catalog (two tables of further questions).
   Every number in the case texts is a {path:format} placeholder filled from D.S (numbers.json), never typed in. */
:root {
  --bg: #ffffff; --surface: #f4f6f5; --ink: #141b19; --muted: #56635f; --line: #d9e0dd; --grid: #e8ecea;
  --accent: #1f7a5c; --accent-soft: #e4f2ec; --hot: #c8501f; --hot-soft: #fbeae1; --know: #6b4fb8; --know-soft: #efeafa; --data-soft: #e6eefa; --dim: #b3bcb9; --bar: #5a6662; --edge: #9aa6a2;
  --d-prod: #2e8a63; --d-web: #2f6fc0; --d-order: #7552c2; --d-ship: #d27a1c; --d-bill: #c23d4b; --d-ret: #a98515;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-num: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.75; }
.in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.45; text-wrap: balance; }
:lang(ja) h1, :lang(ja) h2, :lang(ja) h3 { word-break: auto-phrase; line-break: strict; }
p { margin: 0; }
.ln { display: block; }

/* language switch */
.langbar { display: flex; justify-content: flex-end; padding-top: 16px; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 999px; padding: 4px 14px; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 3px solid var(--accent-soft); }

/* hero */
.hero .in { padding-block: 24px 24px; display: grid; gap: 20px; }
.hero h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 900; line-height: 1.3; }
:lang(en) .hero h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.2; }
.hero .sub { font-size: 19px; color: var(--muted); max-width: 44em; text-wrap: pretty; }
:lang(ja) .hero .sub { word-break: auto-phrase; line-break: strict; }
:lang(en) .hero .sub { max-width: 40em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-block; font-weight: 700; font-size: 16px; padding: 10px 20px; border-radius: 10px; background: var(--accent); color: var(--bg); text-decoration: none; border: 2px solid var(--accent); }
.btn:hover, .btn:focus-visible { outline: 3px solid var(--hot-soft); }
.lic { font-size: 14px; color: var(--muted); }
.btn.ghost { background: var(--bg); color: var(--accent); }

/* diagrams */
.maps .in { padding-block: 24px 64px; display: grid; gap: 28px; }
.kit { border-radius: 18px; padding: 8px 22px 6px; display: grid; min-width: 0; }
.kit.ss { background: var(--surface); }
.kit.ss .map .frame { background: var(--bg); }
.kit.hs { border: 2px solid var(--ink); }
.khead { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; padding: 14px 0 12px; }
.khead .name { font-size: 18px; font-weight: 700; }
.kitnote { font-size: 15px; color: var(--muted); }
.layer { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 20px; padding: 20px 0; border-top: 1px solid var(--line); min-width: 0; }
.lname { display: flex; gap: 10px; align-items: center; align-self: start; font-size: 16px; font-weight: 700; padding-top: 4px; }
.lno { width: 26px; height: 26px; border-radius: 7px; background: var(--ink); color: var(--bg); display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: 14px; flex: none; }
.layer.none .lno { background: var(--dim); }
.layer.none .lname { color: var(--muted); }
.nothing { color: var(--muted); padding-top: 4px; }
.nothing b { font-family: var(--f-display); font-size: 22px; color: var(--ink); margin-right: 10px; }
.mstats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; margin-top: 6px; }
.mstat { border-top: 3px solid var(--ink); padding-top: 6px; display: grid; gap: 2px; }
.mstat b { font-family: var(--f-num); font-weight: 800; font-size: 34px; line-height: 1.1; }
.mstat span { font-size: 14px; color: var(--muted); line-height: 1.5; }
@media (max-width: 760px) { .layer { grid-template-columns: minmax(0, 1fr); gap: 10px; } .mstats { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kit { padding-inline: 16px; } }
.map.small .frame { max-width: 720px; }
.map.small .frame svg { min-width: 520px; }
.map { display: grid; gap: 10px; min-width: 0; }
.map .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.map .count { font-family: var(--f-num); font-weight: 800; font-size: 64px; line-height: 1; }
.map .name { font-size: 18px; font-weight: 700; }
.map .unit { font-size: 22px; font-weight: 700; font-family: var(--f-display); margin-left: -6px; }
.map .stat { font-size: 15px; color: var(--muted); }
.map .stat b { color: var(--ink); font-family: var(--f-num); font-size: 18px; }
.map .frame { background: var(--surface); border-radius: 14px; padding: 16px; overflow-x: auto; }
.map.big .frame svg { min-width: 720px; }
.map svg text { font-family: var(--f-body); }
.node-jp { font-size: 15px; font-weight: 700; fill: var(--ink); }
.node-en { font-family: var(--f-num) !important; font-size: 12px; fill: var(--muted); }
.edge-lb { font-size: 12.5px; fill: var(--ink); }
:lang(en) .edge-lb { font-family: var(--f-num) !important; font-size: 12px; }
.domains { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.domains i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.pgrid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.pcard.wide { grid-column: span 2; }
.pcard.wide ul { columns: 2; column-gap: 28px; display: block; }
.pcard.wide li { break-inside: avoid; margin-bottom: 2px; }
.pcard { border: 1.5px dashed var(--ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.pcard h3 { font-size: 16px; font-family: var(--f-body); display: flex; justify-content: space-between; gap: 8px; }
.pcard h3 span { font-family: var(--f-num); color: var(--muted); }
.pcard ul { margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.6; color: var(--muted); display: grid; gap: 2px; overflow-wrap: anywhere; }
@media (max-width: 900px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .pgrid { grid-template-columns: minmax(0, 1fr); } .pcard.wide { grid-column: auto; } .pcard.wide ul { columns: 1; } }

/* parts: type A (one case, drill-down), type B (two cases, agent diagram), catalog (two tables) */
.part { border-top: 1px solid var(--line); scroll-margin-top: 8px; }
.part > .in { padding-block: 64px; display: grid; gap: 28px; }
.phead { display: grid; gap: 8px; border-left: 6px solid var(--c); padding-left: 16px; }
.phead .kind { font-size: 13px; font-weight: 500; letter-spacing: .05em; color: var(--c); }
.phead h2 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 700; }
.phead p { color: var(--muted); max-width: 62em; }
.phead p { text-wrap: pretty; }
:lang(ja) .phead p { word-break: auto-phrase; line-break: strict; }
.case { display: grid; gap: 22px; scroll-margin-top: 8px; }
.case + .case { border-top: 1px dashed var(--line); padding-top: 36px; }
.chead { display: grid; gap: 2px; }
.chead .clbl { font-size: 12.5px; color: var(--muted); letter-spacing: .04em; }
.chead h3 { font-size: 21px; font-weight: 700; }
.toc { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.toc a { display: grid; gap: 2px; height: 100%; box-sizing: border-box; border: 1.5px solid var(--line); border-left: 5px solid var(--c); border-radius: 12px; padding: 12px 16px; color: var(--ink); text-decoration: none; }
.toc a:hover, .toc a:focus-visible { border-color: var(--c); }
.toc small { font-size: 12.5px; color: var(--c); }
.toc span { font-size: 16px; font-weight: 700; }
.toc em { font-style: normal; font-size: 14px; color: var(--muted); }
.part.intro > .in { padding-block: 56px 8px; }
.blbl { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); }
.num { font-family: var(--f-num); font-weight: 700; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart svg text, .board svg text { fill: var(--muted); font-family: var(--f-num); font-size: 12px; }
.chart svg text.hot { fill: var(--hot); font-weight: 600; }
.chart svg text.ink { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.legend i.dash { background: none !important; border-top: 2px dashed var(--edge); height: 0; }
.qbig { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; }
.mark { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: 26px; line-height: 1; }
.qbig .mark { background: var(--ink); color: var(--bg); }
.qbig h4 { margin: 0; font-family: var(--f-display); font-size: clamp(21px, 3vw, 28px); font-weight: 700; line-height: 1.45; text-wrap: balance; }
:lang(ja) .qbig h4 { word-break: auto-phrase; }

/* type A: dashboard */
.board { border: 1.5px solid var(--line); border-radius: 16px; overflow: hidden; }
.bhead { background: var(--surface); padding: 12px 18px; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; }
.bhead b { font-size: 16px; }
.bhead .asof { font-size: 14px; color: var(--muted); }
.bhead .legend { margin-left: auto; }
.tiles { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tile { padding: 14px 18px 12px; border-top: 1px solid var(--line); display: grid; gap: 2px; min-width: 0; align-content: start; }
.tile:not(:nth-child(3n)) { border-right: 1px solid var(--line); }
.tile.hl { background: var(--hot-soft); }
.tile .tn { font-size: 14px; color: var(--muted); }
.tile .tv { display: flex; align-items: baseline; gap: 4px 10px; flex-wrap: wrap; }
.tile .tv b { font-family: var(--f-num); font-size: 28px; font-weight: 800; line-height: 1.15; }
.tile.hl .tv b { color: var(--hot); }
.tile.pos { background: var(--data-soft); }
.tile.pos .tv b, .tile.pos .yoy { color: var(--d-web); }
.board + .qbig { margin-top: 18px; }
.dchart .board .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.dchart .board .tile { padding: 10px 12px; border-right: 1px solid var(--line); border-top: 0; }
.dchart .board .tile:last-child { border-right: 0; }
.dchart .board .tile .tv b { font-size: 22px; }
@media (max-width: 520px) { .dchart .board .tiles { grid-template-columns: minmax(0, 1fr); } .dchart .board .tile { border-right: 0; border-top: 1px solid var(--line); } }
.tile .yoy { font-family: var(--f-num); font-size: 14px; font-weight: 500; color: var(--muted); }
.tile.hl .yoy { color: var(--hot); }
.tile .spk { margin-top: 4px; }

/* type A: drill-down, conclusion on the left, chart on the right */
.drill { list-style: none; margin: 0; padding: 0; display: grid; }
.dstep { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 32px; padding: 26px 0; border-top: 1px solid var(--line); align-items: start; }
.dtext { display: grid; gap: 6px; align-content: start; }
.dno { font-size: 13px; color: var(--muted); }
.dno b { font-family: var(--f-num); font-weight: 700; color: var(--ink); margin-right: 8px; }
.dtext .head { font-size: 17px; font-weight: 700; line-height: 1.55; }
:lang(ja) .dtext .head { word-break: auto-phrase; }
.dtext .big { font-family: var(--f-num); font-weight: 800; font-size: 40px; line-height: 1.05; color: var(--hot); }
.dtext .sm { font-size: 14px; color: var(--muted); line-height: 1.6; }
.tlist { display: grid; gap: 4px; margin-top: 8px; justify-items: start; }
.tlist > span { font-size: 12px; color: var(--muted); }
.tchips { display: grid; gap: 4px; justify-items: start; }
.tchip { font-size: 13px; padding: 1px 10px 1px 8px; border-radius: 5px; border-left: 4px solid var(--c); background: var(--surface); white-space: nowrap; }
.tchip.new { background: var(--bg); box-shadow: 0 0 0 1.5px var(--c) inset; }
.dchart { display: grid; gap: 8px; min-width: 0; }
.ctitle { font-size: 14px; color: var(--muted); line-height: 1.5; }
.chart { min-width: 0; }
.uses { border: 1.5px solid var(--line); border-radius: 16px; padding: 16px 20px 18px; display: grid; gap: 12px; }
.utitle { font-size: 15px; font-weight: 700; }
.ucols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px; }
.ucols > div { display: grid; gap: 6px; align-content: start; min-width: 0; }
.ucols .lname { padding: 0; font-size: 15px; }
.ucols .lname small { font-size: 12.5px; font-weight: 400; color: var(--muted); }
.uds { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
.uses .fields { justify-content: flex-start; }
.uses .fields span { background: var(--surface); }
.urules { margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.6; display: grid; gap: 2px; }
@media (max-width: 760px) { .ucols { grid-template-columns: minmax(0, 1fr); } }
.answer { background: var(--accent-soft); border-radius: 16px; padding: 18px 20px; display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 14px; align-items: center; }
.answer .mark { background: var(--accent); color: var(--bg); }
.answer p { font-size: 19px; font-weight: 700; line-height: 1.6; }
.trapline { display: flex; gap: 10px; align-items: flex-start; background: var(--hot-soft); border-radius: 12px; padding: 10px 14px; font-size: 15px; }
.trapline svg { width: 20px; height: 20px; flex: none; margin-top: 3px; }

/* type B: agent diagram */
.actors { display: flex; flex-wrap: wrap; gap: 6px 18px; font-size: 14px; color: var(--muted); }
.actors span { display: inline-flex; align-items: center; gap: 6px; }
.actors svg { width: 22px; height: 22px; }
.flow { display: grid; grid-template-columns: minmax(0, 1fr) 26px minmax(0, 1fr) 26px minmax(0, 1fr); align-items: center; }
.arr { text-align: center; color: var(--edge); font-size: 24px; line-height: 1; }
.actor { border-radius: 14px; padding: 14px; display: grid; justify-items: center; gap: 8px; text-align: center; min-width: 0; }
.actor > svg { width: 44px; height: 44px; }
.actor .nm { font-size: 14px; }
.actor.person { background: var(--surface); }
.actor.agent { border: 2px solid var(--ink); }
.actor.src { background: var(--data-soft); border: 1.5px solid var(--d-web); padding: 10px; }
.actor.src .nm { color: var(--d-web); }
.actor.kn { background: var(--know-soft); border: 2px dashed var(--know); padding: 10px; }
.actor.kn .nm { color: var(--know); }
.inputs { display: grid; gap: 10px; width: 100%; }
.inputs .actor > svg { width: 34px; height: 34px; }
.fields { display: flex; flex-wrap: wrap; justify-content: center; gap: 4px; }
.fields span { font-family: var(--f-num); font-size: 12.5px; background: var(--bg); border-radius: 5px; padding: 0 6px; }
.rule { font-size: 14px; line-height: 1.5; }
.rule small { display: block; font-size: 12px; color: var(--know); }
.bubble { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-family: var(--f-display); font-weight: 700; font-size: 16px; line-height: 1.5; text-align: left; }
:lang(ja) .bubble { word-break: auto-phrase; }
.vs { display: grid; gap: 10px; }
.res { border-radius: 14px; padding: 12px 14px; display: grid; gap: 2px; }
.res.bare { border: 1.5px dashed var(--edge); }
.res.set { border: 2px solid var(--know); background: var(--know-soft); }
.res .lb { font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
.res.set .lb { color: var(--know); }
.res .lb svg { width: 16px; height: 16px; }
.res .big { font-family: var(--f-num); font-weight: 800; font-size: 34px; line-height: 1.1; }
.res.bare .big { color: var(--muted); }
.res.set .big { color: var(--know); }
.res .how { font-size: 13px; color: var(--muted); line-height: 1.5; }
.mind { display: grid; gap: 2px; width: 100%; text-align: left; background: var(--bg); border-radius: 12px; padding: 10px 12px; box-sizing: border-box; }
.mind .lb { font-size: 12.5px; color: var(--muted); }
.mind .big { font-family: var(--f-num); font-weight: 800; font-size: 28px; line-height: 1.1; color: var(--hot); }
.mind .how, .res .how { font-size: 12.5px; }
.mini { min-width: 0; }
.mini svg text { fill: var(--muted); font-family: var(--f-num); font-size: 11px; }
.diff { border-left: 4px solid var(--know); padding: 4px 0 4px 12px; font-size: 16px; }
.evid { display: grid; gap: 8px; }
.evid h5 { margin: 0; font-size: 15px; font-weight: 700; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chips span { font-family: var(--f-num); font-size: 14px; font-weight: 600; padding: 2px 10px; border-radius: 6px; background: var(--surface); }
.chips span.moved { background: var(--hot-soft); color: var(--hot); }

/* catalog tables */
.cat { display: grid; gap: 10px; }
.cat + .cat { margin-top: 36px; }
.cat h3 { font-size: 19px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.cat h3 svg { width: 24px; height: 24px; }
.otypes { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: 13px; color: var(--muted); align-items: center; }
table.qt { width: 100%; border-collapse: collapse; font-size: 14.5px; line-height: 1.55; }
.qt th { text-align: left; font-size: 12.5px; font-weight: 500; color: var(--muted); letter-spacing: .03em; padding: 8px 10px; border-bottom: 2px solid var(--ink); }
.qt td { padding: 12px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
.qt td.q { font-weight: 500; width: 30%; }
.qt td:not(.q) { color: var(--muted); }
:lang(ja) .qt td { word-break: auto-phrase; }
.otag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 999px; margin-bottom: 4px; white-space: nowrap; }
.otag.watch { background: var(--hot-soft); color: var(--hot); }
.otag.act { background: var(--accent-soft); color: var(--accent); }
.qt td.set { color: var(--know); }
.qt .set small { display: block; font-size: 12px; color: var(--muted); }

@media (max-width: 900px) {
  .flow { grid-template-columns: minmax(0, 1fr); }
  .flow .arr { transform: rotate(90deg); padding: 6px 0; }
  .vs { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tile:not(:nth-child(3n)) { border-right: 0; }
  .tile:nth-child(odd) { border-right: 1px solid var(--line); }
}
@media (max-width: 760px) {
  .dstep { grid-template-columns: minmax(0, 1fr); gap: 14px; }
  .toc { grid-template-columns: minmax(0, 1fr); }
  .dtext .big { font-size: 36px; }
  table.qt, .qt tbody, .qt tr, .qt td { display: block; width: auto; }
  .qt thead { display: none; }
  .qt tr { border-bottom: 1px solid var(--line); padding: 10px 0; display: grid; gap: 6px; }
  .qt td { border: 0; padding: 0; }
  .qt td.q { width: auto; font-size: 16px; }
  .qt td[data-l]::before { content: attr(data-l); display: block; font-size: 12px; font-weight: 700; color: var(--muted); }
}
@media (max-width: 520px) {
  .tiles { grid-template-columns: minmax(0, 1fr); }

<title>SampleHyperStore の分析体験</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=IBM+Plex+Sans+JP:wght@400;500;700&family=Zen+Kaku+Gothic+New:wght@700;900&display=swap">
<style>
/* Single light theme (white background in every viewer theme). One page, two languages: every text comes from L.ja / L.en and the page re-renders on switch.
   Layout: hero → join diagrams (3 tables vs 12 tables) → business settings → one section per question: vertical table stack on the left, charts on the right */
:root {
  --bg: #ffffff; --surface: #f4f6f5; --ink: #141b19; --muted: #56635f; --line: #d9e0dd; --grid: #e8ecea;
  --accent: #1f7a5c; --accent-soft: #e4f2ec; --hot: #c8501f; --hot-soft: #fbeae1; --dim: #b3bcb9; --edge: #9aa6a2;
  --d-prod: #2e8a63; --d-web: #2f6fc0; --d-order: #7552c2; --d-ship: #d27a1c; --d-bill: #c23d4b; --d-ret: #a98515;
  --f-display: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-body: "IBM Plex Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif;
  --f-num: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}

body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 17px; line-height: 1.75; }
.in { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1, h2, h3 { font-family: var(--f-display); margin: 0; line-height: 1.45; text-wrap: balance; }
:lang(ja) h1, :lang(ja) h2, :lang(ja) h3 { word-break: auto-phrase; line-break: strict; }
p { margin: 0; }
.ln { display: block; }

/* language switch */
.langbar { display: flex; justify-content: flex-end; padding-top: 16px; }
.lang { display: inline-flex; border: 1.5px solid var(--line); border-radius: 999px; padding: 3px; gap: 2px; }
.lang button { font: inherit; font-size: 14px; font-weight: 700; border: 0; border-radius: 999px; padding: 4px 14px; background: transparent; color: var(--muted); cursor: pointer; }
.lang button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.lang button:focus-visible { outline: 3px solid var(--accent-soft); }

/* hero */
.hero .in { padding-block: 24px 24px; display: grid; gap: 20px; }
.hero h1 { font-size: clamp(32px, 6vw, 56px); font-weight: 900; line-height: 1.3; }
:lang(en) .hero h1 { font-size: clamp(30px, 5.4vw, 52px); line-height: 1.2; }
.hero .sub { font-size: 19px; color: var(--muted); max-width: 44em; text-wrap: pretty; }
:lang(ja) .hero .sub { word-break: auto-phrase; line-break: strict; }
:lang(en) .hero .sub { max-width: 40em; }
.cta { display: flex; flex-wrap: wrap; gap: 12px; }
.btn { display: inline-block; font-weight: 700; font-size: 16px; padding: 10px 20px; border-radius: 10px; background: var(--accent); color: var(--bg); text-decoration: none; border: 2px solid var(--accent); }
.btn:hover, .btn:focus-visible { outline: 3px solid var(--hot-soft); }

/* diagrams */
.maps .in { padding-block: 24px 64px; display: grid; gap: 40px; }
.map.small .frame { max-width: 720px; }
.map.small .frame svg { min-width: 520px; }
.map { display: grid; gap: 10px; min-width: 0; }
.map .head { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.map .count { font-family: var(--f-num); font-weight: 800; font-size: 64px; line-height: 1; }
.map .name { font-size: 18px; font-weight: 700; }
.map .unit { font-size: 22px; font-weight: 700; font-family: var(--f-display); margin-left: -6px; }
.map .stat { font-size: 15px; color: var(--muted); }
.map .stat b { color: var(--ink); font-family: var(--f-num); font-size: 18px; }
.map .frame { background: var(--surface); border-radius: 14px; padding: 16px; overflow-x: auto; }
.map.big .frame svg { min-width: 720px; }
.map svg text { font-family: var(--f-body); }
.node-jp { font-size: 15px; font-weight: 700; fill: var(--ink); }
.node-en { font-family: var(--f-num) !important; font-size: 12px; fill: var(--muted); }
.edge-lb { font-size: 12.5px; fill: var(--ink); }
:lang(en) .edge-lb { font-family: var(--f-num) !important; font-size: 12px; }
.domains { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.domains i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; background: var(--c); margin-right: 6px; vertical-align: -1px; }
.pgrid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
.pcard { border: 1.5px dashed var(--ink); border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; align-content: start; min-width: 0; }
.pcard h3 { font-size: 16px; font-family: var(--f-body); display: flex; justify-content: space-between; gap: 8px; }
.pcard h3 span { font-family: var(--f-num); color: var(--muted); }
.pcard ul { margin: 0; padding-left: 1.1em; font-size: 14px; line-height: 1.6; color: var(--muted); display: grid; gap: 2px; overflow-wrap: anywhere; }
@media (max-width: 900px) { .pgrid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 520px) { .pgrid { grid-template-columns: minmax(0, 1fr); } }

/* case */
.case { border-top: 1px solid var(--line); scroll-margin-top: 8px; }
.case > .in { padding-block: 64px; display: grid; gap: 20px; }
.qa { display: grid; gap: 16px; }
.q, .a { display: grid; grid-template-columns: 48px minmax(0, 1fr); gap: 16px; align-items: start; }
.mark { width: 48px; height: 48px; border-radius: 12px; display: grid; place-items: center; font-family: var(--f-num); font-weight: 800; font-size: 26px; line-height: 1; }
.q { padding-inline: 20px 24px; }
.q .mark { background: var(--ink); color: var(--bg); }
.q h2 { font-size: clamp(24px, 3.4vw, 32px); font-weight: 900; padding-top: 2px; max-width: 30em; }
:lang(en) .q h2 { line-height: 1.3; padding-top: 6px; }
.a { background: var(--accent-soft); border-radius: 16px; padding: 20px 24px 22px 20px; }
.a .mark { background: var(--accent); color: var(--bg); }
.atext { font-size: 20px; font-weight: 700; line-height: 1.65; }
.blbl { font-size: 13px; font-weight: 700; letter-spacing: .04em; color: var(--muted); margin-bottom: 8px; }
.a .blbl { color: var(--accent); margin-bottom: 2px; }
.cbody { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.block { border-radius: 16px; padding: 22px 24px; min-width: 0; }
.block.tables { background: var(--surface); align-self: start; }
@media (min-width: 901px) { .block.tables { position: sticky; top: 16px; } }
.block.evidence { background: var(--bg); border: 1.5px solid var(--line); display: grid; gap: 22px; }
.block.evidence > .blbl { margin-bottom: -8px; }
.block.trap { background: var(--hot-soft); padding-block: 16px 18px; }
.block.trap .blbl { color: var(--hot); margin-bottom: 2px; }
.block.trap p:last-child { font-size: 16px; }

/* vertical table stack */
.stack { display: grid; gap: 0; }
.trow { background: var(--bg); border-left: 5px solid var(--c); border-radius: 8px; padding: 10px 14px; display: grid; gap: 2px; }
.trow b { font-size: 16px; }
.trow .csv { font-family: var(--f-num); font-size: 13px; color: var(--c); }
.trow .cols { font-size: 13px; color: var(--muted); line-height: 1.55; }
.trow.know { background: transparent; border: 1.5px dashed var(--ink); margin-top: 8px; }
.trow.know b { font-size: 15px; }
.plbl { font-size: 13px; font-weight: 700; color: var(--muted); margin-top: 18px; }
.link { display: flex; align-items: center; gap: 8px; padding: 3px 0 3px 22px; font-size: 12px; color: var(--muted); }
:lang(en) .link { font-family: var(--f-num); }
.link::before { content: ""; width: 2px; height: 22px; background: var(--line); }

.charts { display: grid; gap: 22px; min-width: 0; }
.panel { display: grid; gap: 6px; min-width: 0; }
.panel h3 { font-family: var(--f-body); font-size: 15px; font-weight: 700; }
:lang(ja) .panel h3 { word-break: auto-phrase; }
.panel .src { display: block; font-family: var(--f-num); font-size: 12px; color: var(--muted); font-weight: 400; }
.multi { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
.duo { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
svg { width: 100%; height: auto; display: block; overflow: visible; }
.charts svg text { fill: var(--muted); font-family: var(--f-num); font-size: 12px; }
.charts svg text.hot { fill: var(--hot); font-weight: 600; }
.charts svg text.ink { fill: var(--ink); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 14px; color: var(--muted); }
.legend i { display: inline-block; width: 14px; height: 4px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 14px; }
.kpi { border-top: 3px solid var(--ink); padding-top: 8px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--f-num); font-weight: 800; font-size: 28px; line-height: 1.2; }
.kpi .t { font-size: 14px; color: var(--muted); line-height: 1.55; }

@media (max-width: 900px) {
  .cbody { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .multi, .duo { grid-template-columns: minmax(0, 1fr); }
  .q, .a { grid-template-columns: minmax(0, 1fr); gap: 8px; }
  .mark { width: 36px; height: 36px; font-size: 20px; border-radius: 10px; }
  .block { padding: 18px 16px; }
  .a { padding: 16px; }
  .q { padding-inline: 16px; }
}
</style>

<div class="in langbar"><div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="ja" lang="ja">日本語</button><button type="button" data-lang="en" lang="en">English</button>
</div></div>

<header class="hero">
  <div class="in">
    <h1 id="h1"></h1>
    <p class="sub" id="sub"></p>
    <div class="cta"><a class="btn" id="cta" href="https://github.com/YoshitakaArakawa/SampleHyperStore" target="_blank" rel="noopener"></a></div>
  </div>
</header>

<section class="maps" id="maps">
  <div class="in">
    <div class="map small">
      <p class="name" id="ss-name"></p>
      <div class="head"><span class="count">3</span><span class="unit" id="ss-unit"></span><span class="stat" id="ss-stat"></span></div>
      <div class="frame" id="map-ss"></div>
    </div>
    <div class="map big">
      <p class="name" id="hs-name"></p>
      <div class="head"><span class="count">12</span><span class="unit" id="hs-unit"></span><span class="stat" id="hs-stat"></span></div>
      <p class="stat" id="hs-note"></p>
      <div class="frame" id="map-hs"></div>
      <div class="domains" id="domains"></div>
    </div>
    <div class="map prefs">
      <p class="name" id="pf-name"></p>
      <div class="head"><span class="count">22</span><span class="unit" id="pf-unit"></span></div>
      <p class="stat" id="pf-note"></p>
      <div class="pgrid" id="pgrid"></div>
    </div>
  </div>
</section>

<main id="cases"></main>
